services:
  yt-sync:
    build: .
    container_name: yt-music-sync-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MAX_MEMBERS=50
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/parties"]
      interval: 30s
      timeout: 10s
      retries: 3
