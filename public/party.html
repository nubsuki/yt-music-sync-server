<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Join Party — YT Music Listen Along</title>
  <meta name="description" content="Join a YouTube Music Listen Along party and listen in sync." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/party.css" />
</head>
<body>
  <a class="back-link" href="/">← All Parties</a>

  <div class="page">
    <div class="invite-card" id="invite-card">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <div>Loading party…</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const partyId = location.pathname.split('/').pop().toUpperCase();
    const card = document.getElementById('invite-card');
    const toast = document.getElementById('toast');

    let partyState = null;
    let socket = null;

    const copySvg = `
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </svg>
    `;

    const checkSvg = `
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    `;

    const musicNoteSvg = `
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>
    `;

    const pauseSvg = `
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="opacity:0.4">
        <rect x="6" y="4" width="4" height="16" rx="1" />
        <rect x="14" y="4" width="4" height="16" rx="1" />
      </svg>
    `;

    const usersSvg = `
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
    `;

    const notFoundSvg = `
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
    `;

    const partyEndedSvg = `
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <rect x="9" y="9" width="6" height="6" rx="1" />
      </svg>
    `;

    const alertSvg = `
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
    `;

    function escHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* Escape a URL for use inside an HTML attribute */
    function escUrl(url) {
      if (!url || typeof url !== 'string') return '';
      try {
        const parsed = new URL(url);
        if (!['https:', 'http:'].includes(parsed.protocol)) return '';
        return escHtml(url);
      } catch {
        return '';
      }
    }

    function showToast(msg, duration = 3000) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function getInitials(name) {
      return (name || '?').slice(0, 2).toUpperCase();
    }

    function buildMembersHtml(members) {
      if (!members || members.length === 0) {
        return `<div class="no-members">No listeners yet — be the first to join!</div>`;
      }
      return members.map(m => `
        <div class="member-chip">
          <div class="member-avatar">${getInitials(m.name)}</div>
          ${escHtml(m.name)}
        </div>`).join('');
    }

    function copyPartyCode() {
      navigator.clipboard.writeText(partyId).then(() => {
        const btn = document.getElementById('copy-btn');
        if (btn) btn.innerHTML = `${checkSvg} Party Code Copied!`;
        showToast(`Code ${partyId} copied! Paste it into YouTube Music.`);
        setTimeout(() => {
          if (btn) btn.innerHTML = `${copySvg} Copy Party Code to Join`;
        }, 3000);
      }).catch(() => {
        showToast(`Party Code: ${partyId}`);
      });
    }

    function renderParty(data) {
      const { id, hostName, state, members } = data;
      const hasSong = state && state.song;
      const safeThumb = state && state.thumbnail ? escUrl(state.thumbnail) : '';
      const thumbHtml = safeThumb
        ? `<img src="${safeThumb}" alt="thumbnail" onerror="this.style.display='none'" />`
        : musicNoteSvg;

      document.title = `${hostName}'s Party (${id}) — Listen Along`;

      card.innerHTML = `
        <div class="party-header">
          <div class="party-label">Party Code</div>
          <div class="party-id-box" onclick="copyPartyCode()" title="Click to copy">
            <div class="party-id">${escHtml(id)}</div>
          </div>
          <div class="host-line">Hosted by <strong>${escHtml(hostName)}</strong></div>
          <div>
            <span class="live-badge"><span class="live-dot"></span> LIVE</span>
          </div>
        </div>

        <div class="now-playing" id="np-section">
          <div class="np-thumb" id="np-thumb">${thumbHtml}</div>
          <div class="np-info">
            <div class="np-label">Now Playing</div>
            <div class="np-song" id="np-song">${hasSong ? escHtml(state.song) : 'Waiting for music…'}</div>
            <div class="np-artist" id="np-artist">${hasSong && state.artist ? escHtml(state.artist) : ''}</div>
          </div>
          <div class="np-status" id="np-status">
            ${state && state.isPlaying
              ? `<div class="playing-bars"><span></span><span></span><span></span></div>`
              : pauseSvg}
          </div>
        </div>

        <div class="members-section">
          <div class="members-label">
            ${usersSvg} Listeners
            <span style="background:rgba(255,255,255,0.08);padding:2px 8px;border-radius:999px;font-size:11px" id="member-count">${(members || []).length}</span>
          </div>
          <div class="members-list" id="members-list">
            ${buildMembersHtml(members)}
          </div>
        </div>

        <div class="join-action-wrap">
          <button class="copy-code-btn" id="copy-btn" onclick="copyPartyCode()">
            ${copySvg} Copy Party Code to Join
          </button>

          <div class="instructions-card">
            <div class="inst-title">How to Join</div>
            <div class="inst-step">
              <span class="inst-num">1</span>
              <div>Click above to copy party code <code>${escHtml(id)}</code></div>
            </div>
            <div class="inst-step">
              <span class="inst-num">2</span>
              <div>Open your <strong>YouTube Music Player</strong> desktop app</div>
            </div>
            <div class="inst-step">
              <span class="inst-num">3</span>
              <div>Click <strong>Listen Along</strong> in the menu, paste code & hit <strong>Join</strong>!</div>
            </div>
          </div>

          <div class="download-hint">
            Don't have the app yet? <a href="https://github.com/nubsuki/YouTube-Music-Player/releases" target="_blank">Download YouTube Music Player</a>
          </div>
        </div>
      `;
    }

    function updateNowPlaying(state) {
      if (!state) return;
      const songEl = document.getElementById('np-song');
      const artistEl = document.getElementById('np-artist');
      const thumbEl = document.getElementById('np-thumb');
      const statusEl = document.getElementById('np-status');

      if (songEl && state.song) songEl.textContent = state.song;
      if (artistEl && state.artist !== undefined) artistEl.textContent = state.artist;
      if (thumbEl && state.thumbnail) {
        const safeThumb = escUrl(state.thumbnail);
        if (safeThumb) {
          thumbEl.innerHTML = `<img src="${safeThumb}" alt="thumbnail" onerror="this.style.display='none'" />`;
        }
      }
      if (statusEl) {
        statusEl.innerHTML = state.isPlaying
          ? `<div class="playing-bars"><span></span><span></span><span></span></div>`
          : pauseSvg;
      }
    }

    function updateMembers(members) {
      const list = document.getElementById('members-list');
      const count = document.getElementById('member-count');
      if (list) list.innerHTML = buildMembersHtml(members);
      if (count) count.textContent = (members || []).length;
    }

    /* Initialize party */
    async function init() {
      try {
        const res = await fetch(`/api/party/${partyId}`);
        if (!res.ok) {
          card.innerHTML = `
            <div class="error-state">
              <div class="error-icon">${notFoundSvg}</div>
              <div class="error-title">Party Not Found</div>
              <div class="error-msg">This party doesn't exist or has already ended.</div>
            </div>`;
          return;
        }

        partyState = await res.json();
        renderParty(partyState);

        try {
          await navigator.clipboard.writeText(partyId);
          showToast(`Party code ${partyId} copied to clipboard!`);
        } catch (e) {
          // Clipboard write without gesture can be blocked by browsers; the button handles manual copy
        }

        socket = io({ transports: ['websocket', 'polling'] });

        socket.on('connect', () => {
          socket.emit('party:watch', { partyId });
        });

        socket.on('party:sync', (state) => {
          updateNowPlaying(state);
          if (state.members) updateMembers(state.members);
        });

        socket.on('party:member-joined', ({ members }) => {
          updateMembers(members);
          showToast('Someone joined the party!');
        });

        socket.on('party:member-left', ({ members }) => {
          updateMembers(members);
        });

        socket.on('party:closed', () => {
          card.innerHTML = `
            <div class="error-state">
              <div class="error-icon">${partyEndedSvg}</div>
              <div class="error-title">Party Ended</div>
              <div class="error-msg">The host has closed this Listen Along session.</div>
            </div>`;
          showToast('Party has ended', 5000);
        });

      } catch (err) {
        card.innerHTML = `
          <div class="error-state">
            <div class="error-icon">${alertSvg}</div>
            <div class="error-title">Connection Error</div>
            <div class="error-msg">${escHtml(err.message)}</div>
          </div>`;
      }
    }

    init();
  </script>
</body>
</html>
